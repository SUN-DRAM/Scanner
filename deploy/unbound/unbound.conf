# Gate C: caching/forwarding resolver for the production docker network.
# Forwards to Cloudflare and Google, in that order, with automatic fallback
# built into forward-zone's own multi-address behavior — "with 1.1.1.1/8.8.8.8
# fallback" per the deploy brief. Not a DNSSEC-validating resolver: both
# upstreams already validate, and running our own validator here would need
# trust-anchor lifecycle management this deployment doesn't otherwise need
# (see deploy/unbound/Dockerfile's comment on why this doesn't affect scan
# accuracy either way).

server:
    interface: 0.0.0.0
    port: 53
    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes

    # Only the production compose network may query this resolver — see
    # docker-compose.prod.yml's `scanner_net` subnet, which must match.
    access-control: 127.0.0.1/32 allow
    access-control: 172.30.0.0/24 allow
    access-control: 0.0.0.0/0 refuse

    cache-min-ttl: 300
    cache-max-ttl: 86400
    prefetch: yes
    hide-identity: yes
    hide-version: yes
    harden-glue: yes
    harden-dnssec-stripped: yes
    use-caps-for-id: yes
    module-config: "iterator"

    logfile: ""
    verbosity: 1

remote-control:
    control-enable: yes
    control-use-cert: no
    control-interface: 127.0.0.1

forward-zone:
    name: "."
    forward-addr: 1.1.1.1
    forward-addr: 1.0.0.1
    forward-addr: 8.8.8.8
    forward-addr: 8.8.4.4
