line-length = 100
target-version = "py312"
src = ["apps/api/app", "apps/api/tests"]

[lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
]
# UP046/UP047: PEP 695 generic syntax (`class Foo[T]`, `def foo[T]`) isn't
# used for Pydantic generic models or the functions that build them —
# TypeVar + Generic[T] is the documented, tested pattern for Pydantic v2
# (see ModuleResult in schemas.py and run_module in scanner/__init__.py).
ignore = ["UP046", "UP047"]

[lint.isort]
known-first-party = ["app"]

[lint.flake8-bugbear]
# FastAPI's dependency-injection style requires `Depends(...)` as an
# argument default — that is the framework's documented pattern (see every
# router in apps/api/app/routers/), not the mutable-default-argument bug
# B008 exists to catch.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[format]
quote-style = "double"
indent-style = "space"
