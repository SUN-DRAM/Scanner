[project]
name = "sun-dram-scanner-api"
version = "1.0.0"
description = "SUN-DRAM Scanner API — TLS/DNS scanner backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy>=2.0,<2.1",
  "alembic>=1.13,<2",
  "psycopg[binary,pool]>=3.2,<4",
  "redis>=5.0,<6",
  "arq>=0.26,<0.27",
  "cryptography>=43.0",
  "pyOpenSSL>=24.2,<25",
  "dnspython>=2.6,<3",
  "idna>=3.7,<4",
  "httpx>=0.27,<0.28",
  "python-whois>=0.9,<1",
  "sentry-sdk>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-pyOpenSSL",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "network: makes a real outbound connection to an external host. Deselected by default (see addopts) — run explicitly with `pytest -m network`. Gate A follow-up A3: the default suite must be deterministic and offline.",
]
addopts = "-m 'not network'"
